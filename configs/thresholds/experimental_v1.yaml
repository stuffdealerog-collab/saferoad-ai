# SafeRoad AI — thresholds profile: experimental_v1
# STATUS: EXPERIMENTAL — chosen by engineering judgment, NOT validated against
# expert-labeled data (tech plan v2 §8, assumption #4). Every analysis run
# records which profile produced it (manifest.json).

track_quality:
  min_track_duration_s: 1.0
  min_track_points: 8
  max_gap_s: 0.5            # longer gap splits the track; no silent interpolation
  teleport_diag_factor: 1.5 # bottom-center jump > K * bbox diagonal -> quarantine
  min_mean_conf:
    person: 0.35
    bicycle: 0.35
    motorcycle: 0.35
    car: 0.40
    bus: 0.40
    truck: 0.40

# Milestones 4-5 will add conflict/near-miss thresholds here.
