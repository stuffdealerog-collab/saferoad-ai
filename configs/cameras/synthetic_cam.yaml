# Per-camera configuration (tech plan v2 §4).
# This is the synthetic test camera; calibration is filled in Milestone 2.
camera_id: synthetic_cam_001
video:
  expected_resolution: [1280, 720]
calibration:
  method: manual_homography
  # Synthetic camera geometry: pure top-down, 20 px = 1 m, origin at frame center.
  # Chosen so ground truth is analytic: car1 @120 px/s = 6.0 m/s = 21.6 km/h.
  image_points: [[0, 0], [1280, 0], [1280, 720], [0, 720], [640, 360]]
  ground_points_m: [[-32.0, -18.0], [32.0, -18.0], [32.0, 18.0], [-32.0, 18.0], [0.0, 0.0]]
  homography: null        # computed from the points at load time
  reprojection_error_m: null
  # validity mask: central 1180x620 px — a 50 px border strip is excluded to
  # exercise the outside-mask flagging path
  validity_mask: [[50, 50], [1230, 50], [1230, 670], [50, 670]]
  ground_plane_assumption: flat   # explicit assumption (v2 §13.1)
geometry:
  conflict_zones:
    # zebra crossing: image x [470..562] px, y [285..435] px -> ground meters
    - id: zebra_west
      type: pedestrian_crossing
      polygon_ground_m: [[-8.5, -3.75], [-3.9, -3.75], [-3.9, 3.75], [-8.5, 3.75]]
    # intersection core: overlap of the two roads
    - id: intersection_core
      type: junction
      polygon_ground_m: [[-4.0, -4.0], [4.0, -4.0], [4.0, 4.0], [-4.0, 4.0]]
  movements: []
thresholds_profile: experimental_v1
